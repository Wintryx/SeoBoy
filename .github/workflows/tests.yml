name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Secret scan
        run: python scripts/check_secrets.py --history
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        env:
          PYTHONIOENCODING: utf-8
        run: python -W error -m unittest discover -s tests -v
