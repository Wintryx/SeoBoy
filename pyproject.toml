[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seoboy"
version = "0.2.0"
description = "Lokales SEO-Audit mit Crawl, GSC-Import und Reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
seoboy = "seoboy.cli:main"

[tool.setuptools]
packages = ["seoboy", "seoboy.migrations"]
package-dir = { seoboy = "src/seoboy", "seoboy.migrations" = "migrations" }

[tool.setuptools.package-data]
"seoboy.migrations" = ["*.sql"]
